# Reviewed allowlist for the BLOCKING pip-audit gate (OPS-1).
#
# The `dependency-audit-blocking` job in .github/workflows/ci.yml audits
# harness/requirements.lock on pushes to `main` and on `v*` tags and fails on any
# known vulnerability that is not listed here. Pull requests only run the advisory
# audit. Validate locally with:
#
#     python -m harness.audit_allowlist check
#
# An entry accepts ONE known vulnerability for a bounded time. Every field is required
# except `package`, and the check fails on an unknown key, a duplicate id, or an entry
# whose `expires` date has passed (`expires` is the last day it is valid), so an
# accepted risk is re-reviewed or removed, never carried silently.
#
#   [[ignore]]
#   id      = "GHSA-xxxx-xxxx-xxxx"   # id exactly as pip-audit prints it (GHSA-*, CVE-*, PYSEC-*)
#   package = "example-package"       # optional, for the reviewer
#   owner   = "github-handle"         # who answers for this acceptance
#   reason  = "Not reachable: the harness never calls the vulnerable parser; tracked in #123."
#   expires = 2027-02-01              # TOML date, last valid day; renew only with a fresh review
#
# Four tornado advisories are accepted until mitmproxy allows a fixed tornado (below).

# CVE-2026-116577, quadratic obs-fold header parsing
[[ignore]]
id      = "GHSA-pcg2-g6cj-q92c"
package = "tornado"
owner   = "Galaeron"
reason  = "Not reachable: tornado is only mitmproxy's dependency for its mitmweb UI; the harness runs mitmdump (harness/safety_proxy_addon.py, PROXY_SETUP.md) and serves nothing with tornado. Fixed in tornado 6.6, but mitmproxy 12.3.1, the latest release, caps tornado<=6.5.10. Remove when a mitmproxy release allows tornado>=6.6.1."
expires = 2027-01-31

