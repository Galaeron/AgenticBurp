name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full suite (07:00 UTC). Per-PR runs the fast smoke subset only; the
    # whole unittest suite runs here on a schedule (fast-subset-per-PR / full-nightly).
    - cron: "0 7 * * *"

# Bind coverage evidence to the commit so a stale artifact from another run can never
# satisfy the gate; the writer (tests) and the gate reconcile the same run id.
env:
  COVERAGE_RUN_ID: ${{ github.sha }}

jobs:
  # Fast tier (every push/PR): the SMOKE SUBSET only -- the detection/investigate/
  # authorization/mass-assignment slices + the coverage manifest. This is the genuine
  # per-PR saving: the full unittest suite is NOT run here (it runs nightly), so a PR
  # gets a fast pipeline-liveness signal. The smoke subset is the "green tests, dead
  # pipeline" tripwire, and it also generates this run's fresh coverage evidence.
  #
  # windows-latest + Python 3.14 match the environment the lock was frozen from.
  fast:
    name: Fast tier (PR smoke subset + coverage gate)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r harness/requirements.lock
      # Every harness step runs from the REPO ROOT: since W-18 the modules import
      # each other as `harness.*` and so need the repo root on sys.path (CLAUDE.md
      # "Run everything from the repository root"). Running these `working-directory:
      # harness` errored on `No module named 'harness'`. Test modules are named
      # `harness.<mod>`; coverage_manifest runs as `-m harness.coverage_manifest`
      # (its evidence dir is module-relative, so it still writes harness/.coverage_runs).
      - name: Clean this run's evidence dir (fresh, run-bound)
        run: python -c "import shutil; shutil.rmtree('harness/.coverage_runs', ignore_errors=True)"
      - name: PR smoke subset (fast signal, writes this run's coverage evidence)
        run: >-
          python -m unittest
          harness.test_smoke_detection
          harness.test_smoke_investigate
          harness.test_smoke_shape_precondition
          harness.test_smoke_authorization_workflow
          harness.test_smoke_phase0_capture_review
          harness.test_mass_assignment_slice
          harness.test_open_redirect_slice
          harness.test_coverage_manifest
      # Real-pipeline gate: drives REAL discovery -> confirmation against a local
      # fixture (only the model boundary is stubbed) and includes the defect-injection
      # proofs that the gate goes red when the pipeline breaks.
      - name: Real-pipeline gate (real discovery -> confirmation)
        run: python -m unittest harness.test_pipeline_gate
      # pytest-native tests unittest's discover CANNOT collect (module-level test
      # functions + fixtures). Before this step they ran in NO tier -- the exact
      # "green tests, dead pipeline" gap. Run them explicitly.
      - name: pytest-native tests (not collected by unittest discover)
        run: >-
          python -m pytest -q
          harness/test_plugin_system.py
          harness/test_execution_protocol.py
          harness/test_hardening.py
      - name: Requirement-coverage gate (declared automated aspects must be a fresh pass)
        run: python -m harness.coverage_manifest --check
      - name: Generate coverage report (always, for diagnostics)
        if: always()
        run: |
          python -m harness.coverage_manifest > harness/coverage_report.md
          python -m harness.coverage_manifest --json > harness/coverage_report.json
      - name: Upload coverage evidence + report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence-fast-${{ github.run_id }}
          path: |
            harness/.coverage_runs/**
            harness/coverage_report.md
            harness/coverage_report.json
          if-no-files-found: warn
      - name: Score math self-test (no model/fixture needed)
        working-directory: testing
        run: python -m unittest test_score

  # Nightly tier (schedule + on-demand): the WHOLE unittest suite, then the coverage
  # gate + report. This is the "full suite nightly" half.
  nightly:
    name: Nightly tier (full suite + coverage report)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r harness/requirements.lock
      # Repo root, same as the fast tier (harness.* imports need it).
      - name: Clean this run's evidence dir
        run: python -c "import shutil; shutil.rmtree('harness/.coverage_runs', ignore_errors=True)"
      - name: Full unit suite (writes this run's coverage evidence)
        run: python -m unittest discover -t . -s harness -p "test_*.py"
      # unittest's discover silently collects ZERO tests from the pytest-native files
      # (module-level functions + fixtures), so the full suite above does not run them.
      # Run them explicitly from the repo root, mirroring the fast tier.
      - name: pytest-native tests (not collected by unittest discover)
        run: >-
          python -m pytest -q
          harness/test_plugin_system.py
          harness/test_execution_protocol.py
          harness/test_hardening.py
      - name: Requirement-coverage gate
        run: python -m harness.coverage_manifest --check
      - name: Generate coverage report (always, for diagnostics)
        if: always()
        run: |
          python -m harness.coverage_manifest > harness/coverage_report.md
          python -m harness.coverage_manifest --json > harness/coverage_report.json
      - name: Upload coverage evidence + report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence-nightly-${{ github.run_id }}
          path: |
            harness/.coverage_runs/**
            harness/coverage_report.md
            harness/coverage_report.json
          if-no-files-found: warn
      - name: Score math self-test
        working-directory: testing
        run: python -m unittest test_score

  # P0.10: CPU-only precision/recall plumbing check, nightly (+ on-demand). Distinct
  # from `scored` below -- this NEVER calls a real model and needs no GPU/self-hosted
  # runner, so it runs on every stock windows-latest runner. It proves the SCORING
  # PLUMBING (analyze() -> agent output -> score.py's math -> SCORECARD.md) stays
  # wired end to end on a tiny, fully-stubbed, committed corpus -- not real model
  # accuracy (that remains `scored`'s job). Never marked required-for-merge: a
  # runner being unavailable must read as "did not run", never as "passed".
  nightly-precision:
    name: Nightly precision (CPU-only, model-stubbed plumbing check)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r harness/requirements.lock
      - name: Plumbing self-test (score.py math + this script's own corpus)
        working-directory: testing
        run: python -m unittest test_nightly_precision
      - name: Run the CPU-only stubbed-model corpus and write SCORECARD.md
        run: python testing/nightly_precision.py
      # Independent of the script's own exit code: an interrupted/absent runner
      # (or a script that silently swallowed its own failure) must never let a
      # missing SCORECARD.md read as a pass.
      - name: Fail if SCORECARD.md was not produced
        run: |
          if (-not (Test-Path SCORECARD.md)) {
            Write-Error "SCORECARD.md was not produced -- the nightly precision run did not complete."
            exit 1
          }
      - name: Upload SCORECARD.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ github.run_id }}
          path: SCORECARD.md
          if-no-files-found: warn

  # Scored tier: enforces the precision AND recall floor (W-8). It needs a local
  # model runner (Ollama + GPU) and the built detection fixture, so it runs only
  # on a [self-hosted, gpu] runner. Rather than `if: false`, it is now armed on
  # demand -- a manual workflow_dispatch, the nightly schedule, or a PR labeled
  # "run-scored" -- so it can gate a PR without forcing every stock PR (which has
  # no GPU runner) to wait. Attach the self-hosted GPU runner to make it execute;
  # W-23 makes this the CI enforcement point for the repeated/blind eval program.
  scored:
    name: Scored tier (precision/recall floor) [needs self-hosted GPU]
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'run-scored'))
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r harness/requirements.lock
      - name: Score against the pinned corpus and enforce the recall + precision floors
        working-directory: testing
        # Precision floor is meaningful now that W-7 (lifecycle demotion) and W-9
        # (structural dedup) have landed -- unconfirmed hypotheses no longer ship
        # as confirmed, and duplicate prose no longer inflates counts.
        run: >-
          python score.py --corpus test-target --from-cache
          --fail-under-recall 0.80 --fail-under-precision 0.50

  # P1.6: `scored` can be SKIPPED entirely (no self-hosted GPU runner attached, no
  # "run-scored" label, not a schedule/dispatch trigger) -- GitHub renders a skipped
  # required check in a way that is easy to misread as "passed" or "not required
  # here, fine either way". This job always runs and reports one of FOUR distinct,
  # honest statuses instead of collapsing "didn't run" and "ran and passed" into
  # one green checkmark:
  #   - failed:     scored ran and did not meet the precision/recall floor (or errored).
  #   - historical: scored ran and passed, but --from-cache is a RESCORE of a
  #                 previously cached fixture (score.py's own freshness_label calls
  #                 this "historical_cache_rescore") -- not a fresh, provenance-bound
  #                 run (P0.4/score_provenance.py). Nothing in this job today
  #                 produces a ScoreProvenance record, so a "fresh" status is never
  #                 claimed here even on success -- that would overclaim.
  #   - not_run:    scored was skipped or cancelled -- no runner/label attached this
  #                 trigger. This is the status an unavailable runner gets; it is
  #                 NEVER read as passing.
  # test_no_orphan_test_files.py's tripwire is unaffected by this job -- it stays
  # wired into the full-suite discovery the `nightly` tier already runs.
  scored-status:
    name: Scored-tier provenance status
    needs: [scored]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report a distinct, honest status (never let "not run" read as "passed")
        shell: bash
        run: |
          case "${{ needs.scored.result }}" in
            success)
              STATUS="historical"
              DETAIL="scored tier ran and met its floors -- a --from-cache rescore, not a fresh provenance-bound run" ;;
            failure)
              STATUS="failed"
              DETAIL="scored tier ran; the precision/recall floor was not met, or it errored" ;;
            skipped)
              STATUS="not_run"
              DETAIL="scored tier did not run this trigger (no self-hosted GPU runner / run-scored label)" ;;
            cancelled)
              STATUS="not_run"
              DETAIL="scored tier was cancelled before completing" ;;
            *)
              STATUS="not_run"
              DETAIL="unrecognized scored-tier result: ${{ needs.scored.result }}" ;;
          esac
          echo "### Scored-tier status: **$STATUS**" >> "$GITHUB_STEP_SUMMARY"
          echo "$DETAIL" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$STATUS ($DETAIL)"
          if [ "$STATUS" = "failed" ]; then
            exit 1
          fi
