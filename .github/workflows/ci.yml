name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full suite (07:00 UTC). The `nightly` job below runs the whole
    # unittest discovery; the `fast` job carries the per-PR signal.
    - cron: "0 7 * * *"

jobs:
  # Fast tier: runs on every push/PR. A quick end-to-end SMOKE SUBSET first (the
  # detection/investigate/authorization/mass-assignment slices + the coverage
  # manifest) so a broken pipeline goes red in seconds, THEN the full unittest
  # suite. The smoke subset is the "green tests, dead pipeline" tripwire; if
  # detection regresses to zero it fails here even though the mocked tests pass.
  #
  # windows-latest + Python 3.14 match the environment the lock was frozen from
  # (the project runs on Windows); pin the lock, not a floating resolve.
  fast:
    name: Fast tier (PR smoke subset + full unit suite)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r harness/requirements.lock
      - name: PR smoke suite (fast signal, includes the mass-assignment slice)
        working-directory: harness
        run: >-
          python -m unittest
          test_smoke_detection
          test_smoke_investigate
          test_smoke_shape_precondition
          test_smoke_authorization_workflow
          test_smoke_phase0_capture_review
          test_mass_assignment_slice
          test_coverage_manifest
      - name: Full unit suite (includes end-to-end detection smoke test)
        working-directory: harness
        run: python -m unittest discover -p "test_*.py"
      - name: Requirement-coverage gate (declared automated checks must be covered)
        working-directory: harness
        run: python coverage_manifest.py --check
      - name: Score math self-test (no model/fixture needed)
        working-directory: testing
        run: python -m unittest test_score

  # Nightly tier: the full unittest suite on a schedule (also runnable on demand
  # via workflow_dispatch), plus the requirement-coverage report. This is the
  # "full suite nightly" half of fast-subset-per-PR / full-suite-nightly.
  nightly:
    name: Nightly tier (full suite + coverage report)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r harness/requirements.lock
      - name: Full unit suite
        working-directory: harness
        run: python -m unittest discover -p "test_*.py"
      - name: Requirement-coverage report + gate
        working-directory: harness
        run: python coverage_manifest.py --check
      - name: Score math self-test
        working-directory: testing
        run: python -m unittest test_score

  # Scored tier: enforces the precision/recall floor. It needs a local model
  # runner (Ollama + GPU) and the built detection fixture, so it cannot run on a
  # stock GitHub-hosted runner. Left disabled until SESSION_4_PLAN.md T2
  # (score.py + fixture + published floor) is complete; then point it at a
  # self-hosted GPU runner and flip `if:` to a real condition.
  scored:
    name: Scored tier (precision/recall floor) [needs self-hosted GPU]
    if: ${{ false }}
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r harness/requirements.lock
      - name: Score against the pinned corpus and enforce the recall floor
        working-directory: testing
        run: python score.py --corpus test-target --from-cache --fail-under-recall 0.80
