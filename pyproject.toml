# Project metadata, dependency declaration, and tooling config.
#
# PACKAGING (W-18): the harness/ modules are now a proper importable package with
# absolute `harness.*` imports (was: flat `import store`, ...), so this IS a
# pip-installable distribution -- the [build-system] table below builds a real
# wheel via setuptools. Run the test suite from the repository ROOT:
#
#     python -m unittest discover -t . -s harness -p "test_*.py"
#
# (the old `cd harness && python -m unittest discover` no longer works, because the
# modules import each other as `harness.*` and so need the repo root on sys.path).
# The server runs as `python -m harness.server` or `uvicorn harness.server:app`.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "burp-llm-harness"
version = "0.1.0"
description = "Burp-native, local-first LLM security-analysis harness (analyst-in-the-loop copilot)."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]   # browser XSS validator (lazy; skips if absent)
proxy = ["mitmproxy==12.2.3"]    # safety proxy addon
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
# The import package is `harness` (distribution name stays burp-llm-harness).
# Picks up harness + harness.agents/validators/testing_fixtures via their __init__.py.
include = ["harness*"]

[tool.pytest.ini_options]
# Most tests use unittest; three pytest-native modules need a separate runner.
# Use `python -m harness.suite full` for both plus standalone evaluation tests.
testpaths = ["harness"]
python_files = ["test_*.py"]
