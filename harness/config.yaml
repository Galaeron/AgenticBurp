# Harness configuration
# Ollama must be running locally: `ollama serve` (default http://localhost:11434)

ollama:
  base_url: "http://localhost:11434"
  # Raised from 120s: three separate real PixelMart runs this session
  # (after also fixing a genuinely broken dual-Ollama-process state --
  # see HANDOVER.md) all showed the shared circuit breaker tripping
  # partway through a 22-exchange run, after several individual agent
  # calls that legitimately took 80-100s+ on this hardware (qwen3:8b,
  # single consumer GPU) before eventually succeeding. Once tripped, the
  # breaker silently zeroed out every remaining agent for the rest of
  # that run with no error surfaced anywhere in the response -- empty
  # findings that looked identical to "the model found nothing." Raised
  # together with lowering concurrency.max_parallel_agents below, not
  # isolated as two separate experiments -- if timeouts recur at 240s,
  # narrow further from here rather than assuming this alone is sufficient.
  timeout_seconds: 240

# How many specialist agents are allowed to run concurrently against
# Ollama through one AgentManager. The application orchestrator shares that
# manager across overlapping exchanges/jobs, so the limit applies across those
# calls, not independently per exchange. Separately constructed orchestrators
# have separate managers; this is not a process-global/Ollama-wide ceiling.
# Without a limit, a single exchange that
# dispatches several agents (or the coordinator failing open to all 36 --
# see orchestrator.py) fires every one of those inference requests
# simultaneously. On a single consumer GPU this can exceed available
# VRAM for concurrent KV-cache allocations: instead of running in
# parallel, requests get queued behind model reloads, spill into slow
# CPU inference, or in the worst case force the OS to page memory to
# disk -- all of which are far slower than just running the same agents
# one at a time. Set to 0 or omit this section entirely for the old
# unbounded behavior (fine if you know your hardware can genuinely run
# that many concurrent inferences -- e.g. a multi-GPU server or a card
# with a lot of headroom).
#
# There's no universally correct number here -- it depends on your
# GPU's VRAM, your model's size, and Ollama's own OLLAMA_NUM_PARALLEL
# setting. 2-3 is a conservative starting point for an 8GB card; raise
# it and watch `ollama ps` / your GPU's memory usage under a real run to
# find your actual ceiling.
concurrency:
  # Lowered from 3 alongside the ollama.timeout_seconds raise above --
  # this specific machine's GPU couldn't sustain 3 concurrent qwen3:8b
  # inferences without individual calls slowing enough to approach the
  # timeout ceiling. 1 fully serializes agent dispatch (slower wall-clock
  # per exchange, but eliminates GPU contention as a variable entirely).
  max_parallel_agents: 1
  # W-13: caps read from this one block instead of magic numbers in the dispatch
  # code. max_concurrent_validations bounds the per-exchange validator fan-out
  # (asyncio.gather is capped at this many in-flight probes); early_termination_
  # batch_size is how many agents run in the first batch before the early-
  # termination check decides whether to run the rest.
  max_concurrent_validations: 6
  early_termination_batch_size: 3

# The coordinator decides which specialist agents to dispatch to, and
# synthesizes their findings into a final report. Use a stronger local
# model here if you have the VRAM for it -- its routing prompt now carries
# trend priors from HackerOne/Intigriti/CWE data (see orchestrator.py),
# so a weak coordinator model is the single biggest risk of a finding
# never being generated at all.
coordinator:
  model: "qwen3:8b"
  temperature: 0.1
  # W-14: how routing fails open when the coordinator returns nothing or errors.
  # "all" (default) fires every available agent -- recall-safe but the most
  # expensive, least predictable path. "curated" fires a high-value, shape-keyed
  # subset instead (the "easiest to miss" core + fast_path's shape matches),
  # cutting the blast radius. Kept "all" by default: flipping to "curated" is a
  # recall trade-off that should be gated on the repeated/blind eval (W-23).
  fail_open_mode: "all"
  # Cloud-primary routing (SESSION_HANDOVER.md §7). DEFAULT OFF -- when false,
  # routing is exactly the legacy behavior (deterministic fast_path first,
  # local coordinator LLM fallback). When true, the cloud model routes FIRST
  # on an ANONYMIZED projection of the exchange (feature_projection.py: method,
  # path, param NAMES, status, response shape, presence booleans -- never any
  # body, header value, query value, or resource id), and fast_path is demoted
  # to a deterministic UNION FLOOR beneath it (the coordinator can only add
  # agents to that floor, never remove them). The cloud model was A/B-validated
  # at 4.0 agents/exchange (31% tighter than fast_path's 5.8) for zero lost
  # detections in the labeled run -- but re-run testing/test-target/
  # ab_routing_recall.py before trusting it as primary on a fresh state.
  cloud_primary: false
  cloud_model: "gemma4:31b-cloud"
  # Cloud-coordinator REASONING seam (Phase 4). DEFAULT OFF, and a stricter,
  # separate opt-in from cloud_primary. When true, the reasoning-heavy passes --
  # the iterative agent's investigation and the adversarial critique -- run on
  # cloud_model instead of the local model. UNLIKE cloud_primary (which sends only
  # an anonymized projection), this sends the REAL exchange content the reasoning
  # needs OFF-HOST, so enable it only where that data egress is acceptable. Flip
  # at runtime via POST /settings {"coordinator": {"cloud_reasoning": true}}.
  cloud_reasoning: false

# Adaptive re-spin loop (SESSION_HANDOVER.md §7). DEFAULT OFF, and further
# a no-op unless coordinator.cloud_primary above is also on -- the loop is
# driven by the cloud coordinator. When enabled: after a first agent pass
# returns nothing at or above min_actionable_confidence, the coordinator is
# asked (on the anonymized projection only) whether a DIFFERENT specialist is
# worth a second look. Bounded by max_rounds AND the effort_budget (checked
# before each escalation call and before each follow-up dispatch), and stops
# as soon as an actionable finding appears. Each escalation's real token cost
# is charged to the ledger as CallKind.ESCALATION.
adaptive_respin:
  enabled: false
  max_rounds: 1
  min_actionable_confidence: 0.4

# Global outbound-request throttle (global_throttle.py). ONE ceiling on how
# fast the harness sends requests to the TARGET, summed across every active
# path at once -- all validators, autonomous discovery, and (once built) the
# iterative agent draw from the same bucket. This is the aggregate blast-radius
# control the tester actually cares about: five agents and three validators
# each "politely" capped still add up at the target. 0 = OFF (unlimited), the
# default, so nothing changes until the tester sets a ceiling (exposed as the
# Burp "Global request throttle" setting). Blocks/paces callers; never drops
# requests. The race-condition and request-smuggling validators are exempt by
# design -- they depend on precise intentional concurrency this would defeat.
throttle:
  max_requests_per_second: 0   # 0 = unlimited

# Cloud models reachable via Ollama's /api/chat but NOT listed by /api/tags, so
# they must be declared here to appear in the UI model pickers (GET /models).
# A large cloud model (gemma 31b) is useful as the coordinator/governor model
# and, for debugging, can be flipped in as the agent model too (POST
# /models/select). Leave empty if you only run local tags.
models:
  cloud:
    - gemma4:31b-cloud
    - gpt-oss:120b-cloud

# Iterative (active) agent -- F4 + F2. A bounded send->observe->adapt loop that
# drives the target, then hands its result to the pause->validate->remember
# integration (pivot_memory). DEFAULT OFF: this is a fundamentally more active
# mode than the passive per-exchange pipeline. When enabled, mutating steps are
# STILL gated by validators.active_enabled + allow_mutating_replay (the safety
# gate) on top of this flag; read-only (GET) probing needs only this flag. Drives
# POST /active-probe. max_steps bounds the loop alongside the effort budget and
# the global throttle.
iterative_agent:
  enabled: false
  max_steps: 250

# Browser-driven XSS validation -- A2 (validators/browser_xss_validator.py).
# Loads candidate URLs in a real headless browser and confirms XSS only on
# observed script execution (a dialog/console/error carrying a per-run nonce),
# not on reflection. Registered by default but only RUNS when
# validators.active_enabled is true AND a headless browser engine is installed
# (`pip install playwright && playwright install chromium`); with no engine it
# skips cleanly. Scope is server.allowed_hosts.
browser_xss:
  enabled: true
  wait_ms: 1200        # settle time after load, for async execution
  max_visits: 8        # cap on (param x payload) URLs visited per finding
  # Optional: drive a CONTAINERISED Chromium over CDP instead of launching one
  # on the host (host-cleanliness, mirroring sqlmap-in-container). Point this at
  # a browser container, e.g. `docker run -p 3000:3000 browserless/chrome` then
  # set: cdp_endpoint: "ws://127.0.0.1:3000". Empty/unset => launch locally
  # (needs `playwright install chromium`). Only the Playwright client lib is
  # needed on the host in CDP mode.
  cdp_endpoint: ""

# Per-vulnerability resource governance -- F5 (resource_governor.py). The
# ceiling for testing ONE vulnerability: how many retries (re-dispatches of the
# same class), how many distinct agent runs, and a hard per-vulnerability token
# cap. These bound the /retry-agents loop. Independent of the GLOBAL budget
# (effort_budget.total_tokens): the loop stops when EITHER the per-vuln policy
# OR the global budget says so. When the global budget can't cover full policy
# for every candidate, POST /plan-allocation prioritizes by impact and returns
# guidance on what's funded vs deferred.
# Engagement closed loop -- F-spine slice 2 (engagement.py). When a finding
# yields a replayable credential (a leaked token/cookie in a response), re-crawl
# the origin as that new identity in-process and fold the new attack surface back
# into the fused worklist -- the SQLi->admin->new-surface loop, automatic.
# DEFAULT OFF: this sends active traffic (a role crawl) as a side effect of
# analysis. Scope-gated to server.allowed_hosts and throttled regardless. With it
# off, the same capability is still detected and queued (visible via
# GET /engagement/<host>), just not auto-executed -- drive it with
# POST /engagement/<host>/advance instead.
engagement:
  auto_escalate: false
  # Blast-radius guard for auto_escalate: hard ceiling on how many credential-
  # triggered re-crawls fire per host in one process lifetime (on top of the
  # per-identity dedup + a one-probe credential verification before each crawl).
  max_auto_escalations: 10
  # The engagement driver (POST /engagement/<host>/run) plans a budgeted
  # "test next" queue from the fused worklist. It only EXECUTES (fetch + analyze
  # the planned targets) when a /run request asks AND this is true -- so the
  # driver never dispatches active testing automatically. DEFAULT OFF: planning
  # is always safe; execution sends traffic.
  driver_execute: false
  # Stateful agent-role feature crawling (feature_workflow.py). When on,
  # investigate_engagement drives each distinct role through the app's real
  # workflows (GET a page -> submit its forms with benign defaults -> follow the
  # result) and folds the captured, session-bearing exchanges into content review
  # and the surface -- reaching the workflow endpoints route-guessing provably
  # cannot (a created ticket, an integration call, a pickle in a session cookie).
  # DEFAULT OFF: it sends active traffic. Form submits are additionally gated by
  # validators.allow_mutating_replay, so with mutating replay off this reduces to
  # an authenticated read-only walk. Scope-gated to server.allowed_hosts + throttled.
  feature_crawl: false
  # Coverage matrix as a DRIVER (I1): after the worklist pass, actively fire every
  # applicable deterministic confirmation leg per (identity x endpoint x check)
  # cell -- regardless of whether an agent labelled that class -- and record the
  # real outcome, so the matrix proves "every applicable check was attempted" and
  # detection no longer depends on LLM label variance. DEFAULT OFF: it sends the
  # extra leg traffic. Bounded by coverage_leg_budget. Legs stay gated by
  # validators.active_enabled + scope; mutating legs also by allow_mutating_replay.
  coverage_drive_legs: false
  coverage_leg_budget: 80

retry_budget:
  max_retries: 2              # extra re-dispatches after the first pass (0 = one pass)
  max_agents: 3              # distinct agent runs per vulnerability, retries included
  max_tokens_per_vuln: 0     # 0 = no per-vuln token cap (only counts + global budget apply)
  stop_on_found: true        # stop as soon as an actionable finding appears
  min_actionable_confidence: 0.4

# Default model for any specialist agent that doesn't set its own "model"
# below. This used to silently fall back to the coordinator's model,
# which meant every unconfigured agent (26 of 36, as of this writing) got
# whatever model the coordinator was tuned to use -- coupling agent
# compute cost to a routing-quality decision that has nothing to do with
# it. Most specialist agents are narrow, well-scoped classification
# tasks and don't need the coordinator's model strength; a smaller model
# is the right default. Gemma 2 9B is a reasonable default size/quality
# point for this -- change the tag to whatever you actually have pulled
# in Ollama (`ollama pull gemma2:9b`, or substitute any model you prefer).
# Per-agent overrides below always take precedence over this.
agent_defaults:
  model: "qwen3:8b"
  temperature: 0.1

# Each agent can use a different model, overriding agent_defaults above.
# Smaller/faster models are fine for narrow, well-scoped classification
# tasks -- only override upward (e.g. back to the coordinator's model or
# stronger) for agents where you've found the default underperforming.
agents:
  sqli:
    enabled: true
    model: "qwen3:8b"
    temperature: 0.1
  xss:
    enabled: true
    model: "qwen3:8b"
    temperature: 0.1
  idor:
    enabled: true
    model: "qwen3:8b"
    temperature: 0.1
  ssrf:
    enabled: true
    model: "qwen3:8b"
    temperature: 0.1
  auth:
    enabled: true
    model: "qwen3:8b"
    temperature: 0.1
  # Added: rising per 2021-2025 bug bounty/CVE data (see README).
  business_logic:
    enabled: true
    model: "qwen3:8b"
    temperature: 0.1
  misconfig:
    enabled: true
    model: "qwen3:8b"
    temperature: 0.1
  ai_llm:
    enabled: true
    model: "qwen3:8b"
    temperature: 0.1
  rate_limit:
    enabled: true
    model: "qwen3:8b"
    temperature: 0.1
  supply_chain:
    enabled: true
    model: "qwen3:8b"
    temperature: 0.1

# Deterministic lookup against GitHub's public Security Advisory
# Database, used to resolve component candidates the supply_chain agent
# extracts. This is the "known" half of "prefer a known-vulnerability
# match over having an LLM try to rediscover it": if a disclosed
# advisory exists for a package name, this reports it directly with a
# citable GHSA/CVE ID instead of relying on model recall (which can be
# stale or simply wrong).
#
# IMPORTANT: unauthenticated GitHub API requests are capped at 60/hour,
# and that ceiling is easy to exhaust in normal use (confirmed directly
# while building this -- a handful of test calls was enough). Set a
# token, via this field or the GITHUB_TOKEN environment variable, to
# raise the limit to 5000/hour. A token needs no special scopes for this
# endpoint (it's a public read), just needs to exist.
github_advisories:
  enabled: true
  token: null  # or set GITHUB_TOKEN in your environment
  max_lookups_per_exchange: 6

# Concept borrowed from Aikido Safe Chain (github.com/AikidoSec/safe-chain):
# a component published to its registry very recently is weak evidence of
# a supply-chain-attack package. Unlike Safe Chain, this queries the real
# public npm/PyPI registries directly rather than Aikido's own malware
# feed (which isn't publicly documented/reachable) -- so treat this as a
# much coarser, lower-confidence signal than what Safe Chain itself
# provides. Findings from this check always carry confidence 0.3.
package_registry_checks:
  enabled: true
  minimum_age_days: 2.0  # Safe Chain's own default is 48 hours

# CISA Known Exploited Vulnerabilities catalog cross-reference. Answers
# "is this actively being exploited in the wild", a stronger and more
# urgent signal than "a disclosed advisory exists" -- see kev_check.py's
# module docstring for an important caveat: the live-fetch path in this
# module has not been verified working from this build's own dev
# environment (blocked by both bot detection and network allowlisting).
# If you hit persistent errors, download a copy manually from
# https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
# and point local_file at it.
kev_check:
  enabled: true
  local_file: null  # e.g. "/path/to/known_exploited_vulnerabilities.json"
  cache_ttl_hours: 24.0

# Adversarial second pass over the highest-confidence findings, modeled
# on "attack your own conclusion before shipping it": rival explanation,
# fragility check, survive/downgrade/reject verdict. Only findings above
# confidence_threshold get reviewed -- low-confidence findings are already
# labeled as guesses and don't need the extra model call.
critique:
  enabled: true
  model: "qwen3:8b"
  temperature: 0.1
  confidence_threshold: 0.5
  max_findings: 12

# Operator-selected token budget for the whole assessment (cumulative
# across every /analyze call this orchestrator process handles, not per
# exchange). Two modes, deliberately not auto-detected -- see effort.py's
# BudgetMode docstring for why this has to be a human decision:
#   soft: warn and record a warning once the budget is spent, but keep
#         going unless/until the operator explicitly confirms otherwise
#         is NOT wanted (see POST /effort/confirm-overspend). Sensible
#         default for this project's only integrated backend today
#         (local Ollama, config above) -- overspend costs time, not money.
#   hard: stop dispatching new agent/critique/routing calls the moment
#         the budget is spent. Appropriate for a metered/paid backend,
#         where silent overspend is a real cost, not just extra wait time.
# total_tokens: null means "track spend for visibility, never block" --
# useful even without picking a hard number. Set an integer to enable
# either mode's actual gating behavior. See POST /estimate (in server.py)
# for a projected total across a discovered URL set, to help pick one.
effort_budget:
  mode: "soft"
  total_tokens: null

server:
  host: "127.0.0.1"
  port: 8787
  # Optional bearer token. REQUIRED automatically when host is non-loopback.
  # Prefer HARNESS_BEARER_TOKEN in the environment rather than committing a token here.
  auth_token: null
  # Optional engagement scope. If non-empty, only these hostnames and their
  # subdomains may be analyzed. Empty means no application-level scope file.
  #
  # Scoped to the local Juice Shop instance only, per explicit user
  # authorization, while validators.active_enabled/allow_mutating_replay
  # are also on below -- this is the actual enforcement of that scope, not
  # just a verbal agreement. Note the real limitation: orchestrator.py's
  # check compares urlparse(url).hostname only (port is stripped), so this
  # restricts to "localhost" as a HOST, not specifically to port 3000 --
  # anything else also listening on localhost (the harness itself on 8787,
  # Ollama on 11434, PixelMart on 5001, etc.) is technically still in
  # scope by this check alone. Revert to [] once done testing against
  # Juice Shop.
  allowed_hosts: ["localhost", "127.0.0.1"]
  # Cap on request/response body bytes sent into prompts, to keep local
  # context windows sane. Bodies are truncated, not dropped, with a marker.
  max_body_chars: 6000

# Validator/tool layer. Agents propose hypotheses; validators independently
# test them. Active validators are OFF by default and never accept a
# model-generated URL/command. They operate only on the original captured
# exchange and inherit the server.allowed_hosts scope.
validators:
  enabled: true
  # SAFE DEFAULT: off in the committed config. Active validators send live
  # requests to the target, so a live/local run turns this on via the
  # git-ignored config.local.yaml overlay (deep-merged by server.load_config),
  # NEVER by flipping it here and committing -- see CLAUDE.md hazard #1.
  # Scoped to server.allowed_hosts above regardless.
  active_enabled: false
  # Separate, stricter opt-in required for the small set of techniques that
  # legitimately need to send a mutating (state-changing) request replay:
  # API security's mass-assignment probe and the race-condition burst.
  # active_enabled alone is NOT sufficient to authorize these -- see
  # safety_gate.py. Off by default; turning this on means those specific
  # probes can cause real side effects on the live target (a real create/
  # update, or the same real mutating action fired multiple times
  # concurrently). Everything else in this harness never needs this flag,
  # by design, regardless of what method the originally captured
  # exchange used. SAFE DEFAULT: off here; a live local run turns it on via
  # config.local.yaml (like active_enabled above), never by a committed flip.
  allow_mutating_replay: false
  # Ceiling on how many times the race-condition validator repeats a
  # mutating request concurrently. This can only lower the effective
  # limit below safety_gate.py's own hard ceiling (20) -- it cannot raise
  # it past that, regardless of what's configured here.
  max_burst_size: 1
  sqlmap:
    enabled: true
    binary: "sqlmap"
    timeout_seconds: 90
    level: 1
    risk: 1
  # Cross-identity (Autorize-style) access-control validator. The single-exchange
  # idor/auth agents can only GUESS at broken access control; this replays the
  # request as ANOTHER identity (+ anonymous) and compares, the only way to tell
  # "my own 200" from "someone else's 200". Tester-fed: the other identity's
  # session headers are supplied at run time via POST /identities/session-headers
  # and held in memory only (never persisted -- see identity_headers.py). Paramount
  # for privilege-escalation detection. DEFAULT OFF (sends live requests); also
  # requires validators.active_enabled and runs GET-only, scoped to allowed_hosts.
  cross_identity:
    enabled: false
    timeout: 10.0
    max_identities: 3
  # OOB command-injection leg: injects a shell payload whose only effect is to
  # fetch a unique collaborator URL, and confirms on the callback (blind-safe, no
  # destructive payload). Registered here; runs only under active_enabled, and a
  # non-GET replay also needs allow_mutating_replay.
  command_injection:
    enabled: true
    timeout: 10.0
  # SSTI leg: injects a nonce-wrapped arithmetic expression and confirms on the
  # evaluated product in the response (proves template evaluation, not RCE).
  ssti:
    enabled: true
    timeout: 10.0
  # Path-traversal leg: injects a traversal sequence into a file/path-shaped
  # parameter and confirms on canonical /etc/passwd or win.ini contents.
  path_traversal:
    enabled: true
    timeout: 10.0
  # Open-redirect leg: points a redirect-shaped parameter at an off-origin
  # sentinel host and confirms if the server's Location header follows it.
  open_redirect:
    enabled: true
    timeout: 10.0
  # Verb-tamper leg: safe subset (read-only alternates + override headers) always
  # on. try_mutating_methods additionally sends PUT/PATCH/DELETE for the common
  # GET-protected/mutating-open shape -- OFF by default, and even when on every
  # mutating send is still gated by allow_mutating_replay (triple-gated).
  verb_tamper:
    enabled: true
    timeout: 10.0
    try_mutating_methods: false
  # Rate-limit / lockout leg (V4): replays the captured auth request min_attempts
  # times via authorize_burst and confirms "no rate limiting" only if all reach
  # the server un-throttled. Needs validators.max_burst_size >= min_attempts to
  # fire meaningfully (else it skips as inconclusive). min_attempts <= hard cap 20.
  rate_limit:
    enabled: true
    timeout: 10.0
    min_attempts: 12
  # Reset-token entropy leg (V3): samples reset tokens observable in responses and
  # confirms only unambiguous predictability (constant/sequential/timestamp/below
  # 64-bit floor/derived). Trigger is a mutating POST (needs allow_mutating_replay).
  reset_token:
    enabled: true
    timeout: 10.0
    samples: 5
  # TOCTOU privilege-escalation race (V19): fires burst_size genuinely-concurrent
  # copies of an authority-changing write (asyncio.gather) and confirms only when a
  # privileged field flipped under concurrency AND >=2 requests succeeded cleanly,
  # via an independent re-read. Needs validators.max_burst_size >= 2 + mutating.
  toctou:
    enabled: true
    timeout: 10.0
    burst_size: 12

# Autonomous scope-discovery MVP (harness/scope_discovery.py). Off by
# default -- the harness has never, until this option exists, decided on
# its own to send a request to a URL a human never captured. GET-only by
# design (SAFE tier per safety_gate.py's own classification), scoped
# through the SAME server.allowed_hosts list above (re-checked per
# candidate URL individually, not just once at the top of analyze()).
# When a finding on an exchange is BOTH confirmed=true AND its category is
# in trigger_categories (a real, validator-confirmed privilege escalation,
# not an LLM guess), the harness probes candidate_paths on the same host
# using the SAME Authorization/Cookie the triggering exchange carried, and
# feeds whatever real responses come back through the same analysis
# pipeline recursively. Deliberately a small, fixed, curated path list for
# this first pass, not open-ended crawling -- that's recon_validator.py's
# job, already built.
autonomous_discovery:
  # SAFE DEFAULT: off in the committed config -- this lets the harness send
  # GET probes to URLs no human captured (scoped to server.allowed_hosts). A
  # live local run enables it via config.local.yaml, never by a committed flip.
  enabled: false
  trigger_categories: ["sqli", "auth", "business_logic", "api_security", "idor"]
  max_new_requests_per_trigger: 5
  candidate_paths:
    - "/api/users"
    - "/api/users/1"
    - "/admin"
    - "/api/admin/config"
    - "/rest/admin/application-configuration"

# LLM-based prioritization pass for the Burp extension's "Attack Surface
# Map" tab (AttackSurfacePanel.java / POST /prioritize). Structure-only
# (method, URL, parameter names -- no bodies), batched into a handful of
# calls per "Scan Site Map" run, not one call per endpoint -- see
# surface_prioritizer.py's own docstring for why. This is a triage/
# ranking pass, not a vulnerability analysis; /analyze still does the
# real work once the analyst picks a candidate off the ranked list.
surface_prioritization:
  enabled: true
  model: "qwen3:8b"
  temperature: 0.1
  max_items_per_call: 40

# Deterministic verification oracle (harness/oracle_framework.py, precision
# item #1/#2). SAFE DEFAULT: off. When enabled, every confirmed finding's
# leg is re-run n_required times (N-of-N reproduction) plus a paired
# negative control before the finding is stamped `verification_state:
# verified` -- otherwise it stays `candidate`. This roughly triples (or
# more) the number of live probes sent per confirmed finding, so it must
# be opted into explicitly, exactly like every other active leg.
oracle:
  enabled: false
  n_required: 3

# Cross-host pattern memory (harness/pattern_memory.py, P2.5). SAFE DEFAULT:
# off. When enabled, a CONFIRMED finding's host-agnostic structural shape
# (method + normalized path template + sorted parameter NAMES -- never a
# host, value, header, or evidence string) is appended to a JSONL log; a
